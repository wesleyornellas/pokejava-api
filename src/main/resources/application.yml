spring:
  application:
    name: pokejava-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pokejava}
    username: ${DB_USERNAME:pokejava}
    password: ${DB_PASSWORD:local_dev_password}
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

pokeapi:
  base-url: https://pokeapi.co/api/v2
  cache:
    maximum-size: ${POKEAPI_CACHE_MAX_SIZE:500}
    expire-after-write: ${POKEAPI_CACHE_TTL:10m}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-32b}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  demo:
    seed-enabled: ${APP_DEMO_SEED_ENABLED:true}
    username: ${APP_DEMO_USERNAME:demo}
    password: ${APP_DEMO_PASSWORD:demo1234}
    display-name: ${APP_DEMO_DISPLAY_NAME:Demo Trainer}
