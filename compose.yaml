services:
  postgres:
    image: postgres:18.6
    container_name: pokejava-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pokejava
      POSTGRES_USER: pokejava
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokejava -d pokejava"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: pokejava-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pokejava
      DB_USERNAME: pokejava
      DB_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-32b}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      APP_DEMO_SEED_ENABLED: ${APP_DEMO_SEED_ENABLED:-true}
      APP_DEMO_USERNAME: ${APP_DEMO_USERNAME:-demo}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:-demo1234}
      APP_DEMO_DISPLAY_NAME: ${APP_DEMO_DISPLAY_NAME:-Demo Trainer}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
