
services:
  postgres:
    image: postgres:18.6
    container_name: pokejava-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pokejava
      POSTGRES_USER: pokejava
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokejava -d pokejava"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
